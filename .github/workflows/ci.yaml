---
name: 'CI: Tests'

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write  # For publishing test results

jobs:
  run-unit-tests:
    name: 'Run Unit Tests'
    runs-on: macos-14  # macOS M1 runner
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup environment
        uses: ./.github/actions/setup
        env:
          VGS_VAULT_ID: ${{ secrets.VGS_VAULT_ID }}

      - name: Run Detekt
        run: ./gradlew vgsshow:detekt --continue

      - name: Run Unit Tests
        run: ./gradlew vgsshow:testDebugUnitTest --continue

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/**
          retention-days: 30

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'Unit Test Results'
          fail_on_failure: true

  run-ui-tests:
    name: 'Run UI Tests'
    runs-on: macos-14  # macOS M1 runner
    timeout-minutes: 10
    if: ${{ startsWith(github.head_ref, 'feature/') }} # Change to main

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup environment
        uses: ./.github/actions/setup
        env:
          VGS_VAULT_ID: ${{ secrets.VGS_VAULT_ID }}

      - name: Assemble debug & test APK
        run: ./gradlew assembleDebug assembleAndroidTest
