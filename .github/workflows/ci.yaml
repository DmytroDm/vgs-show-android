---
name: 'CI'

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write  # For publishing test results

jobs:
  run-unit-tests:
    name: 'Run Unit Tests'
    runs-on: macos-14  # macOS M1 runner
    timeout-minutes: 10
    if: ${{ startsWith(github.head_ref, 'run_ui_tests') }} # Remove after UI tests config complete

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup environment
        uses: ./.github/actions/setup
        env:
          VGS_VAULT_ID: ${{ secrets.VGS_VAULT_ID }}

      - name: Run Detekt
        run: ./gradlew vgsshow:detekt --continue

      - name: Run Unit Tests
        run: ./gradlew vgsshow:testDebugUnitTest --continue

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/**
          retention-days: 30

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'Unit Test Results'
          fail_on_failure: true

  run-ui-tests:
    name: 'Run UI Tests'
    runs-on: macos-14  # macOS M1 runner
    timeout-minutes: 10
    if: ${{ startsWith(github.head_ref, 'feature/') }} # Change to release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup environment
        uses: ./.github/actions/setup
        env:
          VGS_VAULT_ID: ${{ secrets.VGS_VAULT_ID }}

      - name: Setup Google Service Account
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        shell: bash
        run: |
          google_service_key_path=$GITHUB_WORKSPACE/app/gcloud-service-key.json
         
          echo $GOOGLE_SERVICE_ACCOUNT_KEY > $google_service_key_path
          
          project_id=$(cat $google_service_key_path | jq -r ".project_info.project_id")
          
          echo "project_id=$project_id"
          
#          if [ ! -f "$google_service_key_path" ] || [ -z "$project_id" ]; then
#            echo "Google Service Account doesn't exist or project_id is not set."
#            exit 1
#          fi
#
#          cat $google_service_key_path

#      - name: Assemble debug & test APK
#        run: ./gradlew assembleDebug assembleAndroidTest

      - name: Delete Google Service Account Key
        run: |
          rm $GITHUB_WORKSPACE/app/gcloud-service-key.json
