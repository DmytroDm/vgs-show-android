---
name: 'CI'

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write  # For publishing test results

jobs:
  run-unit-tests:
    name: 'Run Unit Tests'
    runs-on: macos-14  # macOS M1 runner
    timeout-minutes: 10
    if: ${{ startsWith(github.head_ref, 'run_ui_tests') }} # Remove after UI tests config complete

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup environment
        uses: ./.github/actions/setup
        env:
          VGS_VAULT_ID: ${{ secrets.VGS_VAULT_ID }}

      - name: Run Detekt
        run: ./gradlew vgsshow:detekt --continue

      - name: Run Unit Tests
        run: ./gradlew vgsshow:testDebugUnitTest --continue

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/**
          retention-days: 30

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'Unit Test Results'
          fail_on_failure: true

  run-ui-tests:
    name: 'Run UI Tests'
    runs-on: macos-14  # macOS M1 runner
    timeout-minutes: 10
    if: ${{ startsWith(github.head_ref, 'feature/') }} # Change to release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup environment
        uses: ./.github/actions/setup
        env:
          VGS_VAULT_ID: ${{ secrets.VGS_VAULT_ID }}

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

